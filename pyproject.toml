[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "webprobe"
version = "0.1.0"
description = "Modular, non-destructive web application security scanner for authorized testing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
webprobe = "webprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webprobe"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
